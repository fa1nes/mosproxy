name: Release binaries

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Version to stamp into a manual build, e.g. v0.0.1-test"
        required: false
        default: "manual"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        goarch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: resolve version
        id: ver
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            echo "version=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          else
            echo "version=${{ github.event.inputs.tag }}/${GITHUB_SHA::8}" >> "$GITHUB_OUTPUT"
          fi

      - name: build
        env:
          CGO_ENABLED: "0"
          GOOS: linux
          GOARCH: ${{ matrix.goarch }}
        run: |
          go build -trimpath \
            -ldflags "-s -w -X main.version=${{ steps.ver.outputs.version }}" \
            -o "mosproxy-linux-${{ matrix.goarch }}" .
          sha256sum "mosproxy-linux-${{ matrix.goarch }}" > "mosproxy-linux-${{ matrix.goarch }}.sha256"
          printf '%s\n' "${{ steps.ver.outputs.version }}" > "mosproxy-linux-${{ matrix.goarch }}.build-id"

      - name: smoke test
        if: matrix.goarch == 'amd64'
        run: |
          ./mosproxy-linux-amd64 --version
          ./mosproxy-linux-amd64 router gen-config /tmp/gen.yaml
          test -s /tmp/gen.yaml

      - uses: actions/upload-artifact@v4
        with:
          name: mosproxy-linux-${{ matrix.goarch }}
          path: |
            mosproxy-linux-${{ matrix.goarch }}
            mosproxy-linux-${{ matrix.goarch }}.sha256
            mosproxy-linux-${{ matrix.goarch }}.build-id

  release:
    if: github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
          path: dist

      - uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          body: ""
          files: dist/*
